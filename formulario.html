<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
        <h1> IFCE </h1>
    <form>
        <fieldset>Dados Pessoais<br>
            <label for="lname"> Nome:</label>
            <input type="text" id="fname" name="fname"><br>
            <label for="date">Data de Nascimento:</label>
            <input type="date" id="date" name="date">
            <label for="lname">Endereço:</label>
            <input type="text" id="lname" name="lname">
            <label for="bairro"> Bairro:</label>
            <input type="text" id="bairro" name="bairro">
            <label for="cidade">Cidade:</label>
            <input type="text" id="cidade" name="cidade">
            <label for="cep">CEP:</label>
            <input type="number" id="cep" name="cep">
            <label for="color">Cor Favorita:</label>
            <input type="color" id="color">
            <label for="satisfacao">Nivel de Satisfação</label>
            <input type="range" id="satisfacao" name="satisfacao" min="0" max="100"><br>
        </fieldset>
        <br>
        <fieldset>Dados Pessoais
            <br>
            <label for="lname">Natureza de Cargo</label><br>
            <br>
            <label for="gerencia"> Gerência</label>
            <input type="checkbox" id="gerencia">
            <label for="financeiro"> Financeiro</label>
            <input type="checkbox" id="financeiro">
            <label for="rececao"> Recpção</label>
            <input type="checkbox" id="rececao">
            <label for="administracao"> Administração</label>
            <input type="checkbox" id="administracao">
            <label for="juridico"> Juridíco</label>
            <input type="checkbox" id="juridico">
            <br><br>
            <label for="lname">Àrea de interesse</label>
            <br>
            <label for="computacao">Computação</label>
            <input type="checkbox" id="computacao">
            <label for="quimica">Química</label>
            <input type="checkbox" id="quimica">
            <label for="meioambiente">Meio Ambiente</label>
            <input type="checkbox" id="meioambiente">
            <label for="engenharia">Engenharia</label>
            <input type="checkbox" id="engenharia">
            <label for="matematica">Matemática</label>
            <input type="checkbox" id="matematica">
            <br><br>
            <label for="lname">Mini Curriculo</label>
            <br>
            <textarea name="mini_curriculo" id="mini_curriculo" rows ="5" cols="40"></textarea>
            <input type="submit" value="Enviar" id="button1"><br>
            <input type="reset" value="Limpar" id="button2"><br>
        </fieldset>
    </form>
</body>
</html>
